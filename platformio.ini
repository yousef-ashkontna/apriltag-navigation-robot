; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nodemcu, esp32cam

[robot]
ota_password = AprilRobotUpdate2640

[env]
build_flags = -DROBOT_OTA_PASSWORD=\"${robot.ota_password}\"

[env:nodemcu]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_src_filter = +<nodemcu/>
lib_ignore = AprilTagESP32
extra_scripts = pre:tools/embed_web.py

[env:esp32cam]
platform = espressif32@6.12.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_src_filter = +<esp32cam/>
board_build.partitions = min_spiffs.csv
build_flags = ${env.build_flags} -DCORE_DEBUG_LEVEL=0

[env:nodemcu_ota]
extends = env:nodemcu
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
    --port=8266
    --auth=${robot.ota_password}

[env:esp32cam_ota]
extends = env:esp32cam
upload_protocol = espota
upload_port = 192.168.4.250
upload_flags =
    --port=3232
    --auth=${robot.ota_password}
